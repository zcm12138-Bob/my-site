<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黄少的个人主页</title>

  <style>
    /* ============================================================
       ★★★ 设计令牌（Design Tokens）★★★
       全站的颜色、字号、间距都只在这里定义一次。
       想换风格，只改这个块，下面几百行自动跟着变。
       ============================================================ */
    :root {
      /* ── 品牌色：只用来点睛，不要拿它当正文颜色 ── */
      --brand:        #38bdf8;
      --brand-deep:   #0ea5e9;
      --brand-soft:   #7dd3fc;
      --brand-alt:    #6366f1;   /* 渐变第二个色 */

      /* ── 背景三层：越靠上的元素越亮，才有“浮起来”的感觉 ── */
      --bg-base:      #0b1120;   /* 最底层：页面背景 */
      --bg-card:      #151f33;   /* 中间层：卡片 */
      --bg-sunken:    #070d18;   /* 下沉层：标签底、输入框 */

      /* ── 文字四层：层次感的全部来源 ── */
      --text-strong:  #f1f5f9;   /* 一级：大标题 */
      --text-base:    #cbd5e1;   /* 二级：正文 */
      --text-muted:   #7b8da4;   /* 三级：说明文字 */
      --text-dim:     #55657a;   /* 四级：页脚、版权 */

      /* ── 边框 ── */
      --border:       #2a3b52;
      --border-soft:  #1b2637;

      /* ── 字号阶梯：只允许用这几个值，别再随手写 0.95rem ── */
      --fs-xs:   0.75rem;    /* 12px  标签、页脚 */
      --fs-sm:   0.875rem;   /* 14px  辅助文字、导航 */
      --fs-base: 1rem;       /* 16px  正文 */
      --fs-lg:   1.125rem;   /* 18px  卡片标题 */
      --fs-xl:   1.5rem;     /* 24px  次标题 */
      --fs-hero: 2.5rem;     /* 40px  首屏大字 */

      /* ── 行高 ── */
      --lh-tight: 1.2;       /* 标题：紧一点才有力 */
      --lh-base:  1.75;      /* 正文：松一点才好读 */

      /* ── 间距阶梯：全是 4 的倍数，全站只用这几个 ── */
      --s-1:  4px;
      --s-2:  8px;
      --s-3:  12px;
      --s-4:  16px;
      --s-6:  24px;
      --s-8:  32px;
      --s-12: 48px;
      --s-16: 64px;
      --s-20: 80px;

      /* ── 圆角 ── */
      --r-sm:   8px;
      --r-md:   14px;
      --r-full: 999px;

      /* ── 阴影与过渡 ── */
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35);
      --ease: 0.2s ease;
    }

    /* ============================================================
       下面开始，所有值都从上面取。你不会再看到硬编码的颜色。
       ============================================================ */

    /* ── 0. 全局 ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }   /* 点导航跳转时平滑滚动 */

    h1,h2,h3 {text-wrap: balance;
    font-weigth: 700; }
    
    p {tect-wrap: pretty;
    overflow-wrap: break-word;}
    .tag, time, .num{font-variant-numeric: tabular-nums;}

    body {
      background: var(--bg-base);
      color: var(--text-base);          /* ★ 正文用中间灰，不是品牌色 */
      font-family:
  -apple-system, BlinkMacSystemFont, "Segoe UI",
  "PingFang SC", "Hiragino Sans GB",
  "Microsoft YaHei", "微软雅黑",
  "Noto Sans SC", "Source Han Sans SC",
  sans-serif;
      line-height: var(--lh-base);
      -webkit-font-smoothing: antialiased;  /* Mac 上字更细腻 */
      font-feature-settings: "kern";        /* 字距微调 */
    }

    ::selection {
      background: var(--brand);
      color: var(--bg-base);            /* 选中文字时也是品牌色，但只是瞬间 */
    }

    a { color: inherit; }

    /* 通用容器 */
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 var(--s-6);
    }

    /* ── 1. 导航栏 ── */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--s-6) 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .logo {
      font-weight: 700;
      font-size: var(--fs-lg);
      color: var(--brand);              /* ★ 品牌色只出现在这种很小的地方 */
      text-decoration: none;
      letter-spacing: 0.02em;           /* 中文标题加一点字距，更透气 */
    }

    .nav-links {
      display: flex;
      gap: var(--s-6);
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: var(--fs-sm);
      transition: color var(--ease);
    }
    .nav-links a:hover { color: var(--text-strong); }

    /* ── 2. 首屏 ── */
    .hero {
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--s-20) 0 var(--s-16);
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--brand-alt));
      display: grid;
      place-items: center;
      font-size: var(--fs-xl);
      font-weight: 700;
      color: var(--bg-base);
      margin-bottom: var(--s-6);
      box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.08);  /* 光晕，很浅 */
    }

    .hero h1 {
      /* clamp(最小值, 随屏幕缩放, 最大值) —— 不用媒体查询就自动适配手机 */
      font-size: clamp(1.5rem, 5vw, var(--fs-hero));
      line-height: var(--lh-tight);
      font-weight: 800;
      color: var(--text-strong);        /* ★ 标题最亮 */
      margin-bottom: var(--s-3);
      letter-spacing: -0.02em;          /* 大标题收紧一点，更精致 */
    }

    .hero p {
      color: var(--text-muted);         /* ★ 说明文字最暗 */
      max-width: 520px;
      font-size: var(--fs-base);
    }
    .btn {
      margin-top: var(--s-6);
      padding: var(--s-3) var(--s-6);
      border: 1px solid var(--border);
      border-radius: var(--r-full);
      background: transparent;
      color: var(--brand-soft);
      font-size: var(--fs-sm);
      font-family: inherit;
      cursor: pointer;
      transition: all var(--ease);
    }
    .btn:hover {
      border-color: var(--brand);
      background: var(--bg-card);
    }

    /* ── 3. 卡片区 ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--s-8);
      padding: var(--s-12) 0;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: var(--s-6);
      transition: border-color var(--ease), transform var(--ease), box-shadow var(--ease);
    }

    .card:hover {
      border-color: var(--border);
      transform: translateY(-3px);
      box-shadow: var(--shadow-card);
    }

    .card h3 {
      font-size: var(--fs-lg);
      line-height: var(--lh-tight);
      font-weight: 600;
      color: var(--text-strong);        /* ★ 卡片标题最亮 */
      margin-bottom: var(--s-2);
    }

    .card p {
      font-size: var(--fs-sm);
      color: var(--text-muted);         /* ★ 卡片说明中等偏暗 */
    }

    .tag {
      display: inline-block;
      margin-top: var(--s-4);
      padding: var(--s-1) var(--s-3);
      border-radius: var(--r-full);
      background: var(--bg-sunken);
      border: 1px solid var(--border-soft);
      font-size: var(--fs-xs);
      color: var(--brand-soft);         /* ★ 标签才用到品牌色 */
    }

    /* ── 4. 页脚 ── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--s-3);
      padding: var(--s-6) 0;
      border-top: 1px solid var(--border-soft);
      font-size: var(--fs-xs);
      color: var(--text-dim);           /* ★ 页脚最暗 */
    }

    /* ── 5. 手机适配 ── */
    @media (max-width: 640px) {
      .hero      { padding: var(--s-12) 0 var(--s-8); }
      .nav-links { gap: var(--s-3); }
      .nav-links a { font-size: var(--fs-xs); }
    }

    /* ============================================================
       ★ 换主题速查：只改 :root 里这几个值，整站变样
       
       冰蓝（现在）：  --brand: #38bdf8   --brand-alt: #6366f1
       薄荷绿：        --brand: #34d399   --brand-alt: #059669
       暖橙：          --brand: #fb923c   --brand-alt: #f43f5e
       莓紫：          --brand: #c084fc   --brand-alt: #818cf8
       金黄：          --brand: #fbbf24   --brand-alt: #f97316

       浅色主题（把背景翻过来）：
         --bg-base: #f8fafc   --bg-card: #ffffff   --bg-sunken: #f1f5f9
         --text-strong: #0f172a   --text-base: #334155
         --text-muted: #64748b    --text-dim: #94a3b8
         --border: #e2e8f0        --border-soft: #e8edf3
       ============================================================ */
  </style>
</head>

<body>

  <!-- ===== 导航栏 ===== -->
  <header class="wrap">
    <nav class="nav">
      <a class="logo" href="index.html">黄思远</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="#about">关于</a></li>
        <li><a href="#skills">技能</a></li>
        <li><a href="#contact">联系</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== 首屏 ===== -->
  <section class="wrap">
    <div class="hero" id="about">
      <div class="avatar">黄思远</div>
      <h1>阜阳师范大学优秀学生</h1>
      <p>我在学前端部署。这个页面是我自己写的，也部署在我自己的网址上。</p>
        <button class="btn" id="changeBtn">换成一句话</button>
     
    </div>
  </section>

  <!-- ===== 卡片区 ===== -->
  <section class="wrap" id="skills">
    <div class="cards" id="girls"></div>
  </section>

  <!-- ===== 页脚 ===== -->
  <footer class="wrap" id="contact">
    <div class="footer">
      <span>© 2026 黄少</span>
      <span>用 HTML 手写，托管在 Vercel</span>
    </div>
  </footer>
<script>
  //-1.数据：以后要加人，只改这里-
  const girls=[{name:'我的大老婆武萍萍', desc:"她是我的精神支柱",tag:"相爱中"},
  {name:'我的二老婆孔维维', desc:"她是我的贴心小棉袄",tag:"相爱中"},
  {name:'我的三老婆张文', desc:"她是我的最严厉的老师",tag:"已拿下"},
{name:'我的四老婆马卓林',desc:'她是zcm的最爱的女人',tag:'被zcm抢走了'}]
  const box = document.getElementById('girls')
  box.innerHTML = girls.map(function(g){return`
    <div class="card">
      <h3>${g.name}</h3>
      <p>${g.desc}</p>
      <span class="tag">${g.tag}</span>
    </div>
        `
      }).join('')
       // ── 换一句话 ──
  const lines = [
    '我在学前端部署。这个页面是我自己写的。',
    '今天学会了函数，点一下就能看出区别。',
    '数据驱动：加一行数据，就多一张卡片。',
    '这是我亲手部署到公网上的网站。'
  ]

  let idx = 0

  const btn = document.getElementById('changeBtn')
  const heroP = document.querySelector('.hero p')

  // 点击时执行这个函数
  btn.addEventListener('click', function () {
    idx = idx + 1
    if (idx >= lines.length) {
      idx = 0          // 到头了就回到第一个
    }
    heroP.textContent = lines[idx]
  })
</script>
</body>
</html>
