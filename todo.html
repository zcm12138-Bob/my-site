<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的待办</title>
</head>
  <style>
    :root {
      --brand:       #38bdf8;
      --brand-deep:  #0ea5e9;
      --bg-base:     #0b1120;
      --bg-card:     #151f33;
      --bg-sunken:   #070d18;
      --text-strong: #f1f5f9;
      --text-base:   #cbd5e1;
      --text-muted:  #7b8da4;
      --text-dim:    #55657a;
      --border:      #2a3b52;
      --border-soft: #1b2637;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      max-width: 688px;
      margin: 0 auto;
      padding: 48px 24px;
      background: var(--bg-base);
      color: var(--text-base);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      line-height: 1.75;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      color: var(--text-strong);
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    #input {
      width: calc(100% - 104px);
      padding: 12px 16px;
      background: var(--bg-sunken);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      color: var(--text-strong);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }
    #input::placeholder { color: var(--text-dim); }
    #input:focus { border-color: var(--brand); }

    #addBtn {
      width: 96px;
      margin-left: 8px;
      padding: 12px 0;
      border: 1px solid var(--brand);
      border-radius: 8px;
      background: var(--brand);
      color: var(--bg-base);
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    #addBtn:hover {
      background: var(--brand-deep);
      border-color: var(--brand-deep);
    }

    #meta {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin: 20px 0 8px;
    }

    #list { list-style: none; }

    #list li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 1rem;
      overflow-wrap: break-word;
    }

    #list li button {
      margin-left: auto;
      flex-shrink: 0;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #list li button:hover {
      border-color: #f43f5e;
      color: #fb7185;
    }

    @media (max-width: 640px) {
      body { padding: 24px 16px; }
    }
      .row { display: flex; gap: 8px; }
    .row #input { width: auto; flex: 1; }
    .row #addBtn { width: 96px; margin-left: 0; }
        .nav {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s ease;
    }
    .nav a:hover { color: var(--text-strong); }
        #clearBtn {
      width: 72px;
      padding: 12px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #clearBtn:hover {
      border-color: #f43f5e;
      color: #fb7185;
    }
    .nav a.on { color: var(--brand); }
        .api {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-soft);
    }
    .api button {
      padding: 10px 20px;
      border: 1px solid var(--brand);
      border-radius: 8px;
      background: transparent;
      color: var(--brand);
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
    }
    .api button:hover {
      background: var(--bg-card);
    }
    #apiOut {
      margin-top: 12px;
      min-height: 26px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    </style>

<body>
      <nav class="nav">
    <a href="index.html">← 回首页</a>
    <a href="profile.html">个人主页</a>
    <a href="todo.html" class="on">待办清单</a>
  </nav>
  <h1>我的待办</h1>function loadUser()
  <div class="row">
    <input id="input" type="text" placeholder="写一件要做的事">
    <button id="addBtn">添加</button>
    <button id="clearBtn">清空</button>
  </div>
  <p id="meta">共 0 条</p>
  <ul id="list"></ul>
    <div class="api">
    <button id="fetchBtn">从 GitHub 抓我的数据</button>
    <p id="apiOut">还没抓</p>
  </div>
  

       <script>
       var saved = localStorage.getItem('todos')

    var todos = saved ? JSON.parse(saved) : ['背 20 个单词', '看 MDN 的数组章节']

    var input  = document.getElementById('input')
    var addBtn = document.getElementById('addBtn')
    var clearBtn = document.getElementById('clearBtn')
    var list   = document.getElementById('list')
    var meta   = document.getElementById('meta')

    // ── 存：把 todos 塞进浏览器的柜子 ──
    function save() {
      localStorage.setItem('todos', JSON.stringify(todos))
    }

    function render() {
      if (todos.length === 0) {
        list.innerHTML = '<li>还没有任务，加一条试试</li>'
        meta.textContent = '共 0 条'
        return
      }

      list.innerHTML = todos.map(function (t, i) {
        return '<li>' + t +
                 ' <button onclick="delTodo(' + i + ')">删</button>' +
               '</li>'
      }).join('')

      meta.textContent = '共 ' + todos.length + ' 条'
    }

    function addTodo() {
      var text = input.value
      if (text === '') { return }

      todos.push(text)
      input.value = ''
      save()      // ← 新加的，存完再画
      render()
    }
        function clearAll() {
      if (todos.length === 0) { return }
      todos = []
      save()
      render()
    }

    function delTodo(i) {
      todos.splice(i, 1)
      save()      // ← 新加的
      render()
    }

    addBtn.addEventListener('click', addTodo)
    clearBtn.addEventListener('click', clearAll)
        var fetchBtn = document.getElementById('fetchBtn')
    var apiOut   = document.getElementById('apiOut')

        function loadUser() {
      apiOut.textContent = '正在抓……'

      fetch('https://api.github.com/users/zcm12138-Bob')
        .then(function (res) {
          if (!res.ok) {
            throw new Error('对方说：' + res.status)
          }
          return res.json()
        })
        .then(function (data) {
          apiOut.textContent =
            data.login + '：' + data.public_repos + ' 个仓库，' +
            data.followers + ' 个粉丝'
        })
        .catch(function (err) {
          apiOut.textContent = '出错了：' + err.message
        })
    }
    fetchBtn.addEventListener('click', loadUser)

    render()
  </script>
</body>
</html>
